[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "playbooks-sdk"
version = "1.0.0"
description = "Typed synchronous and asynchronous clients for the Playbooks platform API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.28,<0.29"]

[project.urls]
Repository = "https://github.com/playbooks-hq/playbooks-clients"
Issues = "https://github.com/playbooks-hq/playbooks-clients/issues"

[project.optional-dependencies]
dev = ["ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/playbooks_sdk"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "TID252"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/playbooks_sdk"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
